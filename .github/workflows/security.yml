name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, because new advisories appear without any code change.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main (push or schedule) always finish.
concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Scanner images are pinned to the versions verified locally; bump them deliberately.
env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # safe.directory: the checkout belongs to the runner user, not the container user.
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          "$GITLEAKS_IMAGE" git /repo --redact --no-banner

  dependencies:
    name: dependency and code audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: npm audit (production dependencies)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install audit tools
        run: python -m pip install pip-audit==2.10.1 -c apps/api/requirements.txt bandit
      - name: pip-audit (pinned API dependencies)
        run: pip-audit --strict --disable-pip --no-deps -r apps/api/requirements.txt
      - name: Bandit
        run: bandit -c apps/api/pyproject.toml -r apps/api/app

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy (dependencies, secrets, misconfiguration)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" "$TRIVY_IMAGE"
          fs /repo --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1
