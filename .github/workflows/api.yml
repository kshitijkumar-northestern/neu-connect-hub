name: api

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main (push or schedule) always finish.
concurrency:
  group: api-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: lint, types, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: local
          POSTGRES_DB: nu_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d nu_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only values for the throwaway service database; no real secrets.
      DATABASE_URL: postgresql+asyncpg://app:local@localhost:5432/nu_hub
      TEST_DATABASE_URL: postgresql+asyncpg://app:local@localhost:5432/nu_hub_test
      SESSION_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Create the test database
        run: docker exec "${{ job.services.postgres.id }}" psql -U app -d nu_hub -c "CREATE DATABASE nu_hub_test"
      - name: Install
        run: python -m pip install -c apps/api/requirements.txt -e "apps/api[dev]"
      - name: Lint
        run: ruff check apps/api && ruff format --check apps/api
      - name: Types
        working-directory: apps/api
        run: mypy
      - name: Migration check
        run: |
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini check
      - name: Tests
        run: pytest apps/api/tests
