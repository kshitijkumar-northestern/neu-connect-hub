[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neu-connect-hub-api"
version = "0.1.0"
description = "NU Connect Hub API: FastAPI, Python Socket.IO and PostgreSQL with pgvector."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-socketio>=5.11",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "python-socketio[asyncio_client]>=5.11",
  "ruff>=0.8",
  "mypy>=1.13",
  "bandit>=1.8",
  "pip-tools>=7.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The migration template always imports sqlalchemy and pgvector (autogenerate renders
# vector columns through pgvector.sqlalchemy), so a given migration may not use them.
"alembic/versions/**" = ["F401"]

[tool.ruff.lint.isort]
# apps/api/alembic/ holds migrations; the import is the installed Alembic package.
known-third-party = ["alembic"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
# python-socketio ships no type information.
module = ["socketio", "socketio.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
