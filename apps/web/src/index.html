<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NU Connect Hub</title>
    <!-- Applies the saved or system theme before first paint, so the wrong theme never flashes.
         Keep the key in sync with THEME_STORAGE_KEY in src/app/providers/ThemeProvider.tsx.
         The production Content Security Policy allows this script by the sha256 of its built
         (minified) text: webpack.config.cjs computes it on every build, and the postbuild check
         (scripts/check-csp.mjs) fails the build if the two ever disagree. It must stay the only
         inline script, and keep id="theme-init". -->
    <script id="theme-init">
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem("nu-theme");
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <noscript>NU Connect Hub needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
